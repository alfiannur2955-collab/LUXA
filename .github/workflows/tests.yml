name: Tes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi frontend (dipakai tes warna heatmap & payload)
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Cache aset engine browser (Pyodide, wheels, rhino3dm)
        uses: actions/cache@v4
        with:
          path: frontend/.engine-cache
          key: luxa-engine-${{ hashFiles('frontend/scripts/fetch_engine_assets.sh') }}
      - name: Siapkan aset engine browser (Pyodide) untuk tes paritas
        run: |
          bash scripts/fetch_engine_assets.sh
          npm run engine:assets
        working-directory: frontend
      - name: Pasang LibreOffice Calc (untuk uji hitung ulang laporan Excel)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Pasang dependensi Python
        run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Jalankan pytest
        # -rs mencetak ringkasan tes yang dilewati (jika ada) agar log CI mudah diaudit.
        run: python -m pytest -q -rs
      - name: Bandingkan hasil fixture dengan baseline
        # Gagal bila angka OTTV/geometri fixture berubah. Perubahan disengaja: jalankan
        # `python tools/snapshot_baseline.py`, periksa selisihnya, lalu commit baseline baru.
        run: python tools/compare_baseline.py

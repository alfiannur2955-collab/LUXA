name: Tes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - name: Pasang dependensi
        run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Jalankan pytest
        # Tes hitung ulang LibreOffice dan paritas engine browser dilewati otomatis bila alatnya tidak ada.
        run: python -m pytest -q

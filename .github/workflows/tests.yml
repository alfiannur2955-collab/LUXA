name: Tes

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Pasang dependensi frontend (dipakai tes warna heatmap)
        run: npm ci --ignore-scripts
        working-directory: frontend
      - name: Pasang dependensi
        run: pip install -r backend/requirements.txt -r requirements-dev.txt
      - name: Jalankan pytest
        # Tes hitung ulang LibreOffice dan paritas engine browser dilewati otomatis bila alatnya tidak ada.
        run: python -m pytest -q
      - name: Bandingkan hasil fixture dengan baseline
        # Gagal bila angka OTTV/geometri fixture berubah. Perubahan disengaja: jalankan
        # `python tools/snapshot_baseline.py`, periksa selisihnya, lalu commit baseline baru.
        run: python tools/compare_baseline.py
